name: Build and Deploy Food Delivery Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install DevOps Tools
        uses: Bengo-Hub/devops-k8s/.github/actions/install-devops-tools@main

      - name: Set deployment variables
        run: |
          echo "DEPLOY=true" >> $GITHUB_ENV
          echo "SETUP_DATABASES=false" >> $GITHUB_ENV
          echo "DB_TYPES=none" >> $GITHUB_ENV
          echo "NAMESPACE=food-delivery" >> $GITHUB_ENV
          echo "ENV_SECRET_NAME=ordering-frontend-env" >> $GITHUB_ENV
          echo "REGISTRY_SERVER=docker.io" >> $GITHUB_ENV
          echo "REGISTRY_NAMESPACE=codevertex" >> $GITHUB_ENV
          echo "VALUES_FILE_PATH=apps/ordering-frontend/values.yaml" >> $GITHUB_ENV
          echo "APP_NAME=ordering-frontend" >> $GITHUB_ENV

      - name: Debug available secrets
        run: |
          echo "Checking which tokens are available..."
          [[ -n "${{ secrets.GH_PAT }}" ]] && echo "✅ GH_PAT is set" || echo "❌ GH_PAT not found"
          [[ -n "${{ secrets.GIT_SECRET }}" ]] && echo "✅ GIT_SECRET is set" || echo "❌ GIT_SECRET not found"
          [[ -n "${{ secrets.GIT_TOKEN }}" ]] && echo "✅ GIT_TOKEN is set" || echo "❌ GIT_TOKEN not found"
          [[ -n "${{ secrets.GITHUB_TOKEN }}" ]] && echo "✅ GITHUB_TOKEN is set (default)" || echo "❌ GITHUB_TOKEN not found"
          echo "Note: GH_PAT or GIT_SECRET required for cross-repo push to devops-k8s"

      - name: Sync deployment secrets
        env:
          GH_TOKEN: ${{ secrets.PROPAGATE_PAT || secrets.GH_PAT || secrets.GIT_TOKEN || github.token }}
        run: |
          REQUIRED_SECRETS=(REGISTRY_USERNAME REGISTRY_PASSWORD REGISTRY_EMAIL GIT_TOKEN KUBE_CONFIG)
          MAX_RETRIES=3
          MAX_WAIT=300
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "[Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES] Triggering secret sync from devops-k8s..."
            
            gh workflow run sync-secrets.yml \
              --repo Bengo-Hub/devops-k8s \
              -f target_repo=${{ github.repository }} \
              -f secrets="${REQUIRED_SECRETS[*]}"
            
            echo "Waiting for sync workflow to complete (max ${MAX_WAIT}s)..."
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))
              
              # Check if secrets exist
              MISSING=0
              for secret in "${REQUIRED_SECRETS[@]}"; do
                if ! gh secret list --repo ${{ github.repository }} 2>/dev/null | grep -q "^${secret}[[:space:]]"; then
                  MISSING=$((MISSING + 1))
                fi
              done
              
              if [ $MISSING -eq 0 ]; then
                echo "✅ All secrets synced successfully after ${ELAPSED}s"
                exit 0
              fi
              
              echo "⏳ Still waiting... (${MISSING} secrets pending, ${ELAPSED}s elapsed)"
            done
            
            echo "⚠️  Timeout waiting for secrets (attempt $((RETRY_COUNT + 1)))"
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "❌ Failed to sync secrets after $MAX_RETRIES attempts"
          echo "Build.sh will attempt to continue with existing secrets..."
          exit 0

      - name: Run production deployment
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          # GitHub tokens for cross-repo push (priority order in build.sh)
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_SECRET: ${{ secrets.GIT_SECRET }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Registry credentials
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          # Deployment configuration
          DEPLOY: true
          SETUP_DATABASES: false
          DB_TYPES: none
          NAMESPACE: food-delivery
          ENV_SECRET_NAME: ordering-frontend-env
          REGISTRY_SERVER: docker.io
          REGISTRY_NAMESPACE: codevertex
          VALUES_FILE_PATH: apps/ordering-frontend/values.yaml
          APP_NAME: ordering-frontend
          GIT_USER: ${{ secrets.GIT_USER || 'Ordering Bot' }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL || 'dev@bengobox.com' }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Tag and push :latest
        if: success()
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_SERVER: docker.io
          REGISTRY_NAMESPACE: codevertex
        run: |
          set -e
          IMAGE_REPO="${REGISTRY_SERVER}/${REGISTRY_NAMESPACE}/ordering-frontend"
          SHORT_SHA=${GITHUB_SHA::8}
          echo "Tagging ${IMAGE_REPO}:${SHORT_SHA} as :latest"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_SERVER" -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "${IMAGE_REPO}:${SHORT_SHA}" || true
          docker tag "${IMAGE_REPO}:${SHORT_SHA}" "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:latest"

      - name: Check ArgoCD Application status
        if: success()
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
          NS: food-delivery
          APP_NAME: ordering-frontend
        run: |
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "⏭️ Skipping ArgoCD check - no KUBE_CONFIG available"
            exit 0
          fi

          echo "::group::ArgoCD Application Status"
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config

          if kubectl get application ${APP_NAME} -n argocd >/dev/null 2>&1; then
            echo "✓ ArgoCD Application '${APP_NAME}' found"
            kubectl patch application ${APP_NAME} -n argocd --type merge -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true
            SYNC_STATUS=$(kubectl get application ${APP_NAME} -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH_STATUS=$(kubectl get application ${APP_NAME} -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            echo "Current Status - Sync: ${SYNC_STATUS}, Health: ${HEALTH_STATUS}"
          else
            echo "⚠️ ArgoCD Application '${APP_NAME}' not found"
            echo "Trigger provisioning: gh workflow run provision.yml --repo Bengo-Hub/devops-k8s"
          fi
          echo "::endgroup::"

      - name: Verify frontend health
        if: success()
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
          NS: food-delivery
        run: |
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "⏭️ Skipping health check - no KUBE_CONFIG available"
            exit 0
          fi

          echo "::group::Health check"
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config

          if kubectl get deployment ordering-frontend-app -n ${NS} >/dev/null 2>&1; then
            kubectl rollout status deployment/ordering-frontend-app -n ${NS} --timeout=300s
            HOSTS=$(kubectl get ingress -n ${NS} -o jsonpath='{.items[*].spec.rules[*].host}' | tr ' ' '\n' | grep -E 'fooddeliveryapp' || true)
            if [ -n "$HOSTS" ]; then
              for H in $HOSTS; do
                echo "Checking https://$H/healthz ..."
                if curl -sk --max-time 10 "https://$H/healthz" | grep -qi "ok"; then
                  echo "✅ Health OK for $H"
                  break
                fi
              done
            else
              echo "No ingress host found; skipping external health probe"
            fi
          else
            echo "Deployment not found yet - ArgoCD may still be syncing"
          fi
          echo "::endgroup::"
